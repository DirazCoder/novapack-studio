name: Build NovaByte Studio (manual artifacts)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read package version
        id: package
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "::error::Could not read a version field from package.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

  build:
    needs: read-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
            folder: win-x64
          - os: ubuntu-latest
            flag: --linux
            folder: linux-x64
          - os: macos-latest
            flag: --mac
            folder: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.folder }}
        run: node build.mjs ${{ matrix.flag }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaByte-Studio-${{ matrix.folder }}-${{ needs.read-version.outputs.version }}
          path: dist/${{ matrix.folder }}/
          retention-days: 7
          if-no-files-found: error
