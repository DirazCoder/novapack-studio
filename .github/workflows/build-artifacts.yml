name: Build NovaByte Studio (manual artifacts)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read package version
        id: package
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "::error::Could not read a version field from package.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

  build:
    needs: read-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
            folder: win-x64
          - os: windows-11-arm
            flag: --win-arm64
            folder: win-arm64
          - os: ubuntu-latest
            flag: --linux
            folder: linux-x64
          - os: ubuntu-24.04-arm
            flag: --linux-arm64
            folder: linux-arm64
          - os: macos-latest
            flag: --mac
            folder: osx-arm64
          - os: macos-26-intel
            flag: --mac-x64
            folder: osx-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # EMSDK CACHE SETUP
      # -------------------------------------------------------------
      - name: Set EMSDK Target Path
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "EMSDK_PATH=$RUNNER_TEMP\emsdk" >> $GITHUB_ENV
            echo "EMSDK_ARCH=x86_64" >> $GITHUB_ENV
          else
            echo "EMSDK_PATH=$RUNNER_TEMP/emsdk" >> $GITHUB_ENV
          fi

      - name: Clone EMSDK Manifest for Cache Key
        run: git clone --depth 1 https://github.com/emscripten-core/emsdk.git "${{ env.EMSDK_PATH }}"

      - name: Cache Emscripten SDK
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: ${{ env.EMSDK_PATH }}
          key: emsdk-${{ runner.os }}-${{ matrix.folder }}-x86_64-${{ hashFiles(format('{0}/emscripten-releases-tags.json', env.EMSDK_PATH)) }}

      # -------------------------------------------------------------
      # INSTALL EMSDK (Runs only if cache misses)
      # -------------------------------------------------------------
      - name: Install Emscripten SDK (Windows)
        if: runner.os == 'Windows' && steps.cache-emsdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & (Join-Path "${{ env.EMSDK_PATH }}" 'emsdk.bat') install latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path "${{ env.EMSDK_PATH }}" 'emsdk.bat') activate latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Emscripten SDK (Linux/macOS)
        if: runner.os != 'Windows' && steps.cache-emsdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          "${{ env.EMSDK_PATH }}/emsdk" install latest
          "${{ env.EMSDK_PATH }}/emsdk" activate latest

      # -------------------------------------------------------------
      # EXPOSE ENVIRONMENT VARIABLES (Runs on both Hit and Miss)
      # -------------------------------------------------------------
      - name: Load Emscripten Environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $emsdkPath = $env:EMSDK_PATH
          $emsdkEnvironment = & $env:ComSpec /d /c "call `"$emsdkPath\emsdk.bat`" construct_env >nul && set"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $environmentVariables = @{}
          foreach ($line in $emsdkEnvironment) {
            if ($line -match '^([^=]+)=(.*)$') {
              $environmentVariables[$Matches[1]] = $Matches[2]
            }
          }

          $requiredVariables = @('EMSDK', 'EMSDK_NODE', 'EMSDK_PYTHON', 'PATH')
          $missingVariables = $requiredVariables | Where-Object { -not $environmentVariables.ContainsKey($_) }
          if ($missingVariables) {
            throw "EMSDK did not provide required environment variables: $($missingVariables -join ', ')"
          }

          foreach ($name in @('EMSDK', 'EMSDK_NODE', 'EMSDK_PYTHON', 'EM_CONFIG', 'EM_CACHE')) {
            if ($environmentVariables.ContainsKey($name)) {
              "$name=$($environmentVariables[$name])" >> $env:GITHUB_ENV
            }
          }

          $environmentVariables['PATH'] -split ';' |
            Where-Object { $_ -like "$emsdkPath*" } |
            ForEach-Object { $_ >> $env:GITHUB_PATH }

      - name: Load Emscripten Environment (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "${{ env.EMSDK_PATH }}" >> $GITHUB_PATH
          echo "EMSDK=${{ env.EMSDK_PATH }}" >> $GITHUB_ENV
          source "${{ env.EMSDK_PATH }}/emsdk_env.sh"
          echo "EM_CONFIG=$EM_CONFIG" >> $GITHUB_ENV

      # -------------------------------------------------------------
      # BUILD RUNNERS & DEPENDENCIES
      # -------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.folder }}
        run: node build.mjs ${{ matrix.flag }}

      # -------------------------------------------------------------
      # CLEANUP & BUNDLING
      # -------------------------------------------------------------
      - name: Clear Emscripten SDK cache & clean installers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $command = 'call "{0}" >nul && emcc --clear-cache' -f (Join-Path "${{ env.EMSDK_PATH }}" 'emsdk_env.bat')
          & $env:ComSpec /d /s /c $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path (Join-Path "${{ env.EMSDK_PATH }}" 'zips')) { Remove-Item -Recurse -Force (Join-Path "${{ env.EMSDK_PATH }}" 'zips') }
          if (Test-Path (Join-Path "${{ env.EMSDK_PATH }}" '.git')) { Remove-Item -Recurse -Force (Join-Path "${{ env.EMSDK_PATH }}" '.git') }

      - name: Clear Emscripten SDK cache & clean installers (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          source "${{ env.EMSDK_PATH }}/emsdk_env.sh"
          emcc --clear-cache
          rm -rf "${{ env.EMSDK_PATH }}/zips"
          rm -rf "${{ env.EMSDK_PATH }}/.git"

      - name: Bundle Emscripten SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE "dist\${{ matrix.folder }}")
          Copy-Item -Recurse "${{ env.EMSDK_PATH }}" (Join-Path $env:GITHUB_WORKSPACE "dist\${{ matrix.folder }}\emsdk")

      - name: Bundle Emscripten SDK (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.folder }}"
          cp -a "${{ env.EMSDK_PATH }}" "dist/${{ matrix.folder }}/emsdk"

      # -------------------------------------------------------------
      # PACKAGING ARTIFACTS
      # -------------------------------------------------------------
      - name: Install 7-Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip -y --no-progress
            echo "C:\Program Files\7-Zip" >> $env:GITHUB_PATH
          }

      - name: Install 7-Zip (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Install 7-Zip (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install sevenzip

      - name: Archive build with Ultra Settings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: dist/${{ matrix.folder }}
        run: 7z a -mx=9 -m0=lzma2 -md=64m -ms=on "..\NovaByte-Studio-${{ matrix.folder }}-${{ needs.read-version.outputs.version }}.7z" .

      - name: Archive build with Ultra Settings (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: dist/${{ matrix.folder }}
        run: |
          COMMAND=$(command -v 7z || command -v 7zz)
          $COMMAND a -mx=9 -m0=lzma2 -md=64m -ms=on "../NovaByte-Studio-${{ matrix.folder }}-${{ needs.read-version.outputs.version }}.7z" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaByte-Studio-${{ matrix.folder }}
          path: dist/NovaByte-Studio-${{ matrix.folder }}-${{ needs.read-version.outputs.version }}.7z
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
