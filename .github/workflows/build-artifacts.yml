name: Build NovaByte Studio (manual artifacts)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read package version
        id: package
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "::error::Could not read a version field from package.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

  build:
    needs: read-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
            folder: win-x64
          - os: ubuntu-latest
            flag: --linux
            folder: linux-x64
          - os: macos-latest
            flag: --mac
            folder: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Install Emscripten SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $emsdk = Join-Path $env:RUNNER_TEMP 'emsdk'
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git $emsdk
          & (Join-Path $emsdk 'emsdk.bat') install latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $emsdk 'emsdk.bat') activate latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Emscripten SDK (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install latest
          "$RUNNER_TEMP/emsdk/emsdk" activate latest

      - name: Build ${{ matrix.folder }}
        run: node build.mjs ${{ matrix.flag }}

      - name: Clear Emscripten SDK cache & clean installers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $emsdk = Join-Path $env:RUNNER_TEMP 'emsdk'
          # Fixed path sourcing execution:
          $command = 'call "{0}" >nul && emcc --clear-cache' -f (Join-Path $emsdk 'emsdk_env.bat')
          & $env:ComSpec /d /s /c $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          
          # Remove heavy installer zips and local configurations
          if (Test-Path (Join-Path $emsdk 'zips')) { Remove-Item -Recurse -Force (Join-Path $emsdk 'zips') }
          if (Test-Path (Join-Path $emsdk '.git')) { Remove-Item -Recurse -Force (Join-Path $emsdk '.git') }

      - name: Clear Emscripten SDK cache & clean installers (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcc --clear-cache
          
          # Remove heavy installer zips and git histories
          rm -rf "$RUNNER_TEMP/emsdk/zips"
          rm -rf "$RUNNER_TEMP/emsdk/.git"

      - name: Bundle Emscripten SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE "dist\${{ matrix.folder }}")
          Copy-Item -Recurse (Join-Path $env:RUNNER_TEMP 'emsdk') (Join-Path $env:GITHUB_WORKSPACE "dist\${{ matrix.folder }}\emsdk")

      - name: Bundle Emscripten SDK (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.folder }}"
          cp -a "$RUNNER_TEMP/emsdk" "dist/${{ matrix.folder }}/emsdk"

      - name: Install 7-Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip -y --no-progress
            echo "C:\Program Files\7-Zip" >> $env:GITHUB_PATH
          }

      - name: Install 7-Zip (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Install 7-Zip (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install sevenzip
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Archive build with Ultra Settings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: dist/${{ matrix.folder }}
        run: 7z a -mx=9 -m0=lzma2 -md=64m -ms=on "..\NovaByte-Studio-${{ matrix.folder }}-${{ needs.read-version.outputs.version }}.7z" .

      - name: Archive build with Ultra Settings (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: dist/${{ matrix.folder }}
        run: |
          # Use 7zz on mac or standard 7z on Linux
          COMMAND=$(command -v 7z || command -v 7zz)
          $COMMAND a -mx=9 -m0=lzma2 -md=64m -ms=on "../NovaByte-Studio-${{ matrix.folder }}-${{ needs.read-version.outputs.version }}.7z" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaByte-Studio-${{ matrix.folder }}
          path: dist/NovaByte-Studio-${{ matrix.folder }}-${{ needs.read-version.outputs.version }}.7z
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
